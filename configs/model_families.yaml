model_families:
  tree:
    downstream_models: [xgboost, lightgbm, catboost, random_forest]
    schema_priorities: [thresholds, buckets, boolean_indicators, categorical_grouping, nonlinear_interactions]
  linear_svm:
    downstream_models: [logistic_regression, linear_svm, rbf_svm]
    schema_priorities: [smooth_scores, normalized_values, severity_measures, weighted_composites]
  distance_knn:
    downstream_models: [knn]
    schema_priorities: [scale_normalized_features, similarity_scores, prototype_distances, cluster_indicators]
