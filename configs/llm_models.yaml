schema_generators:
  - id: claude-sonnet-4.6
    provider: anthropic
    provider_model: claude-sonnet-4-6
    env_key: ANTHROPIC_API_KEY
    reasoning: max_available
  - id: claude-opus-4.7
    provider: anthropic
    provider_model: claude-opus-4-7
    env_key: ANTHROPIC_API_KEY
    reasoning: max_available
  - id: gpt-5.5-pro
    provider: openai
    provider_model: gpt-5.5-pro
    env_key: OPENAI_API_KEY
    reasoning: high
  - id: gemini-3.1-pro-preview
    provider: gemini
    provider_model: gemini-3.1-pro-preview
    env_key: GEMINI_API_KEY
    reasoning: max_available

judgment_fillers:
  - id: deepseek-r1
    provider: deepseek
    provider_model: deepseek-reasoner
    env_key: DEEPSEEK_API_KEY
    role: primary_low_cost
  - id: deepseek-v4-pro
    provider: deepseek
    provider_model: deepseek-v4-pro
    env_key: DEEPSEEK_API_KEY
    role: primary_reasoning
  - id: claude-sonnet-4.6
    provider: anthropic
    provider_model: claude-sonnet-4-6
    env_key: ANTHROPIC_API_KEY
    role: verification_subset
